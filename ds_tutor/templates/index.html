<title>个性化算法学习助手</title>
<script>
// Mermaid 加载 — 国内用 unpkg 兜底
window._mermaidReady = false;
(function loadMermaid(){
  var s = document.createElement('script');
  s.src = 'https://registry.npmmirror.com/mermaid/10.9.0/files/dist/mermaid.min.js';
  s.onload = function(){
    mermaid.initialize({startOnLoad:false, theme:'default', securityLevel:'loose'});
    window._mermaidReady = true;
  };
  s.onerror = function(){
    console.warn('Mermaid CDN 加载失败，流程图将显示为原始代码');
  };
  document.head.appendChild(s);
})();
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --red: #f85149; --yellow: #d2991d;
  --radius: 8px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; overflow:hidden; }
/* sidebar */
.sidebar { width:220px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:16px 0; flex-shrink:0; }
.sidebar .logo { padding:0 16px 20px; font-size:18px; font-weight:700; color:var(--accent); }
.sidebar nav { flex:1; display:flex; flex-direction:column; }
.sidebar nav a { color:var(--text-dim); text-decoration:none; padding:10px 20px; font-size:14px; cursor:pointer; transition:.15s; border-left:3px solid transparent; user-select:none; }
.sidebar nav a:hover, .sidebar nav a.active { color:var(--text); background:rgba(88,166,255,0.08); border-left-color:var(--accent); }
.sidebar .status { padding:16px; font-size:12px; color:var(--text-dim); border-top:1px solid var(--border); }
/* main */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.header { padding:16px 24px; border-bottom:1px solid var(--border); font-size:14px; font-weight:600; background:var(--surface); }
.content { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; }
/* cards */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
.card.warn { border-color:var(--yellow); background:rgba(210,153,29,0.06); }
.card-header { font-weight:600; margin-bottom:12px; color:var(--accent); font-size:14px; display:flex; align-items:center; gap:8px; }
.card-header.warn { color:var(--yellow); }
.card-body { font-size:14px; line-height:1.7; }
/* markdown styles */
.card-body h1,.card-body h2,.card-body h3 { margin:16px 0 8px; color:var(--accent); }
.card-body h4 { margin:12px 0 4px; color:var(--text); }
.card-body table { width:100%; border-collapse:collapse; margin:12px 0; }
.card-body th,.card-body td { border:1px solid var(--border); padding:8px 12px; text-align:left; font-size:13px; }
.card-body th { background:rgba(88,166,255,0.1); color:var(--accent); }
.card-body pre { background:#0d1117; border:1px solid var(--border); border-radius:var(--radius); padding:16px; overflow-x:auto; margin:12px 0; }
.card-body code { font-family:'Fira Code','Cascadia Code','Courier New',monospace; font-size:13px; }
.card-body pre code { display:block; }
.card-body blockquote { border-left:3px solid var(--accent); padding:8px 16px; margin:12px 0; background:rgba(88,166,255,0.05); color:var(--text-dim); }
.card-body p { margin:8px 0; }
.card-body ul,.card-body ol { margin:8px 0; padding-left:24px; }
.card-body li { margin:4px 0; }
.card-body strong { color:var(--text); }
.card-body em { color:var(--text-dim); }
.card-body hr { border:none; border-top:1px solid var(--border); margin:16px 0; }
/* inline code (not in pre) */
.card-body :not(pre) > code { background:rgba(88,166,255,0.1); padding:2px 6px; border-radius:4px; font-size:13px; }
/* syntax highlighting */
.kw { color:#ff7b72; } .str { color:#a5d6ff; } .cm { color:#8b949e; font-style:italic; }
.num { color:#79c0ff; } .fn { color:#d2a8ff; } .op { color:#ff7b72; } .pp { color:#79c0ff; }
/* inputs */
.input-area { border-top:1px solid var(--border); padding:16px 24px; background:var(--surface); }
.input-row { display:flex; gap:12px; }
textarea, input[type=text], input[type=password] { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:12px; color:var(--text); font-size:14px; resize:none; font-family:inherit; }
textarea:focus, input:focus { outline:none; border-color:var(--accent); }
.btn { background:var(--accent); color:#fff; border:none; border-radius:var(--radius); padding:10px 20px; font-size:14px; cursor:pointer; font-weight:600; transition:.15s; white-space:nowrap; }
.btn:hover { opacity:.85; }
.btn.secondary { background:var(--border); }
.btn.danger { background:var(--red); }
.form-row { display:flex; gap:12px; margin-bottom:8px; align-items:center; }
.form-row label { width:80px; font-size:13px; color:var(--text-dim); flex-shrink:0; }
.form-row select { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:8px; color:var(--text); font-size:13px; }
/* spinner */
.spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; margin-right:8px; }
@keyframes spin { to{transform:rotate(360deg);} }
/* stats */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; text-align:center; }
.stat-val { font-size:28px; font-weight:700; color:var(--accent); }
.stat-label { font-size:12px; color:var(--text-dim); margin-top:4px; }
/* errors */
.error-item { padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:13px; }
.tag { padding:2px 10px; border-radius:12px; font-size:11px; font-weight:600; }
.tag.red { background:rgba(248,81,73,0.15); color:var(--red); }
.tag.yellow { background:rgba(210,153,29,0.15); color:var(--yellow); }
.tag.green { background:rgba(63,185,80,0.15); color:var(--green); }
/* empty */
.empty-state { text-align:center; padding:48px 24px; color:var(--text-dim); }
.empty-state .icon { font-size:48px; margin-bottom:16px; }
/* mermaid diagram container */
.mermaid-block { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin:12px 0; overflow-x:auto; text-align:center; }
.mermaid-block svg { max-width:100%; }
.mermaid-raw { background:var(--bg); border:1px dashed var(--border); border-radius:var(--radius); padding:16px; margin:12px 0; overflow-x:auto; }
.mermaid-raw pre { margin:0; font-size:12px; color:var(--text-dim); }
/* chat bubbles */
.chat-list { display:flex; flex-direction:column; gap:16px; }
.chat-msg { max-width:85%; padding:14px 18px; border-radius:12px; font-size:14px; line-height:1.7; word-wrap:break-word; }
.chat-msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
.chat-msg.ai { align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
.chat-msg .msg-label { font-size:11px; margin-bottom:6px; opacity:.7; font-weight:600; }
.chat-msg h1,.chat-msg h2,.chat-msg h3 { margin:12px 0 6px; }
.chat-msg .chat-msg h1,.chat-msg.ai h1,.chat-msg.ai h2,.chat-msg.ai h3 { color:var(--accent); }
.chat-msg table { width:100%; border-collapse:collapse; margin:10px 0; font-size:13px; }
.chat-msg th,.chat-msg td { border:1px solid var(--border); padding:6px 10px; text-align:left; }
.chat-msg.ai th { background:rgba(88,166,255,0.1); color:var(--accent); }
.chat-msg.user th { background:rgba(255,255,255,0.1); }
.chat-msg pre { border-radius:6px; padding:12px; overflow-x:auto; margin:10px 0; font-size:12px; }
.chat-msg.ai pre { background:#0d1117; border:1px solid var(--border); }
.chat-msg.user pre { background:rgba(0,0,0,0.2); }
.chat-msg code { font-family:'Fira Code','Cascadia Code','Courier New',monospace; font-size:12px; }
.chat-msg :not(pre) > code { padding:2px 5px; border-radius:3px; }
.chat-msg.ai :not(pre) > code { background:rgba(88,166,255,0.1); }
.chat-msg.user :not(pre) > code { background:rgba(255,255,255,0.15); }
.chat-msg blockquote { border-left:3px solid var(--accent); padding:6px 12px; margin:8px 0; }
.chat-msg.ai blockquote { background:rgba(88,166,255,0.05); }
.chat-msg ul,.chat-msg ol { padding-left:20px; margin:6px 0; }
.chat-msg li { margin:3px 0; }
.chat-msg p { margin:6px 0; }
.chat-msg hr { border:none; border-top:1px solid var(--border); margin:12px 0; }
.chat-bar { display:flex; gap:10px; align-items:center; }
.chat-bar input { flex:1; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">🧠 算法学习助手</div>
  <nav>
    <a data-page="explain" class="active">📖 可视化讲解</a>
    <a data-page="analyze">🔍 代码分析</a>

  </nav>
  <div class="status" id="apiStatus">🔗 检查中...</div>
</aside>

<main class="main">
  <div class="header" id="pageTitle">📖 可视化知识点讲解</div>
  <div class="content" id="content"></div>
  <div class="input-area" id="inputArea"></div>
</main>

<script>
// ═══════════════════════════════════════
// 纯 JS Markdown → HTML 解析器 (零外部依赖)
// ═══════════════════════════════════════
function parseMarkdown(text) {
  if (!text) return '';
  var html = text;

  // 修复 LLM 把多行表格挤成一行：将 "| |" (分隔行 + 数据行挤在一起) 拆开
  // 例如 |---|...| | 1 |...|  →  |---|...|\n| 1 |...|
  html = html.replace(/\|\s*\|/g, function(m) {
    // 连续的 "| |" 表示行边界被吃了，补回换行
    return '|\n|';
  });

  // 行内代码 (先处理，防止被其他规则破坏)
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // 标题
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // 粗体/斜体
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // 引用
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

  // 分隔线
  html = html.replace(/^---$/gm, '<hr>');

  // 无序列表
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

  // 有序列表
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

  // 段落 (连续非空行)
  html = html.replace(/\n\n+/g, '</p><p>');
  html = '<p>' + html + '</p>';

  // 清理
  html = html.replace(/<p>\s*<\/p>/g, '');
  html = html.replace(/<p>(<h[1-4]>)/g, '$1');
  html = html.replace(/(<\/h[1-4]>)<\/p>/g, '$1');
  html = html.replace(/<p>(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)<\/p>/g, '$1');
  html = html.replace(/<p>(<blockquote>)/g, '$1');
  html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
  html = html.replace(/<p>(<hr>)<\/p>/g, '$1');

  // 表格
  html = html.replace(/<p>\|(.+)\|<\/p>\n<p>\|[-| :]+\|<\/p>\n((?:<p>\|.+\|<\/p>\n?)+)/g, function(match, header, body) {
    const headers = header.split('|').filter(h => h.trim()).map(h => '<th>' + h.trim() + '</th>').join('');
    const rows = body.replace(/<p>\|(.+)\|<\/p>/g, function(m, row) {
      const cells = row.split('|').filter(c => c.trim()).map(c => '<td>' + c.trim() + '</td>').join('');
      return '<tr>' + cells + '</tr>';
    });
    return '<table><thead><tr>' + headers + '</tr></thead><tbody>' + rows + '</tbody></table>';
  });

  return html;
}

// C++ 语法高亮 (简易版)
function highlightCode(code, lang) {
  if (!lang || lang === 'plaintext' || lang === 'text') {
    return code.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  let html = code.replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // 注释
  html = html.replace(/(\/\/.*$)/gm, '<span class="cm">$1</span>');
  // 字符串
  html = html.replace(/(&quot;.*?&quot;)/g, '<span class="str">$1</span>');
  html = html.replace(/(".*?")/g, '<span class="str">$1</span>');
  // 关键字
  const kws = ['int','long','float','double','char','bool','void','auto','const',
    'if','else','for','while','do','return','break','continue','switch','case',
    'struct','class','public','private','protected','namespace','using','include',
    'typedef','sizeof','new','delete','this','virtual','override','static',
    'vector','map','set','queue','stack','string','pair','priority_queue',
    'push_back','size','empty','begin','end','front','back','top','pop','clear',
    'true','false','nullptr','NULL','memset','memcpy','sort','lower_bound',
    'std','cout','cin','endl','scanf','printf','define','ifndef','endif',
  ];
  const kwPattern = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  html = html.replace(kwPattern, '<span class="kw">$1</span>');
  // 数字
  html = html.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  // 预处理指令
  html = html.replace(/(#\w+)/g, '<span class="pp">$1</span>');
  // 函数调用
  html = html.replace(/\b([a-zA-Z_]\w*)(?=\s*\()/g, '<span class="fn">$1</span>');

  return html;
}

// 为代码块添加语法高亮
function highlightAllCode(container) {
  const pres = container.querySelectorAll('pre');
  pres.forEach(pre => {
    if (pre.dataset.highlighted) return;
    pre.dataset.highlighted = '1';
    let code = pre.textContent || pre.innerText || '';
    // 尝试检测语言
    let lang = 'cpp';
    if (code.includes('def ') || code.includes('import ')) lang = 'python';
    pre.innerHTML = '<code>' + highlightCode(code, lang) + '</code>';
  });
}

// 渲染 Mermaid 图表 — 支持 ```mermaid 代码块和 `mermaid 内联代码
function isMermaidCode(text) {
  text = text.trim();
  // 去掉可能的 "mermaid" 前缀（被当成语言标记时）
  var t = text.replace(/^mermaid\s*\n?/i, '').trim();
  return /^(graph |flowchart |sequenceDiagram|classDiagram|stateDiagram|gantt|pie|erDiagram|%%)/.test(t);
}

async function renderMermaidDiagrams(container) {
  var blocks = [];

  // 1. 从 <pre><code> 中找（标准三反引号代码块）
  container.querySelectorAll('pre code').forEach(function(code) {
    var text = (code.textContent || '').trim();
    if (isMermaidCode(text)) {
      blocks.push({el: code.parentElement, code: text});
    }
  });

  // 2. 从内联 <code> 中找（LLM 用了单反引号 `mermaid ...`）
  container.querySelectorAll(':not(pre) > code').forEach(function(code) {
    var text = (code.textContent || '').trim();
    if (isMermaidCode(text)) {
      blocks.push({el: code.parentElement, code: text});
    }
  });

  if (blocks.length === 0) return;

  if (!window._mermaidReady) {
    blocks.forEach(function(b) {
      b.el.className = 'mermaid-raw';
      b.el.innerHTML = '<pre style="margin:0"><code style="font-size:12px;color:var(--text-dim)">' + escapeHtml(b.code) + '</code></pre>';
    });
    return;
  }

  for (var i = 0; i < blocks.length; i++) {
    var code = blocks[i].code.replace(/^mermaid\s*\n?/i, '').trim();
    try {
      var wrapper = document.createElement('div');
      wrapper.className = 'mermaid-block';
      wrapper.innerHTML = '<div class="mermaid">' + code + '</div>';
      blocks[i].el.replaceWith(wrapper);
    } catch(e) {
      blocks[i].el.className = 'mermaid-raw';
      blocks[i].el.innerHTML = '<pre style="margin:0"><code style="font-size:12px;color:var(--text-dim)">' + escapeHtml(code) + '</code></pre>';
    }
  }
  try {
    await mermaid.run({querySelector: '.mermaid-block .mermaid'});
  } catch(e) {
    console.warn('Mermaid render error:', e);
  }
}

// ═══════════════════════════════════════
// 页面逻辑
// ═══════════════════════════════════════

let currentPage = 'explain';

// 侧边栏点击事件
document.querySelectorAll('.sidebar nav a').forEach(a => {
  a.addEventListener('click', function() {
    switchPage(this.dataset.page);
  });
});

async function init() {
  try {
    const r = await fetch('/api/config');
    const c = await r.json();
    document.getElementById('apiStatus').textContent = c.has_key ? '🔗 已连接' : '⚠️ 未配置 API Key';
  } catch(e) {
    document.getElementById('apiStatus').textContent = '⚠️ 无法连接';
  }
  switchPage('explain');
}
init();

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
  document.querySelector('[data-page="' + page + '"]').classList.add('active');
  renderPage(page);
}

const titles = {
  explain:'📖 可视化知识点讲解', analyze:'🔍 代码错误分析',
  practice:'🏋️ 靶向练习题', memory:'📋 错误记忆库',
  stats:'📊 学习统计', config:'⚙️ 设置'
};

function renderPage(page) {
  document.getElementById('pageTitle').textContent = titles[page] || '';
  const content = document.getElementById('content');
  const inputArea = document.getElementById('inputArea');

  switch(page) {
    case 'explain': renderExplain(content, inputArea); break;
    case 'analyze': renderAnalyze(content, inputArea); break;
    case 'practice': renderPractice(content, inputArea); break;
    case 'memory': loadMemory(content, inputArea); break;
    case 'stats': loadStats(content, inputArea); break;
    case 'config': renderConfig(content, inputArea); break;
  }
}

function escapeHtml(text) {
  return text.replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Explain (聊天模式) ─────────────────
let chatHistory = []; // 当前会话的对话记录

function renderExplain(content, inputArea) {
  if (chatHistory.length === 0) {
    content.innerHTML =
      '<div class="empty-state">' +
        '<div class="icon">🎯</div>' +
        '<p>输入你想了解的算法或数据结构</p>' +
        '<p style="font-size:13px;color:var(--text-dim)">例如：KMP算法、Dijkstra、线段树、动态规划...</p>' +
      '</div>';
  } else {
    content.innerHTML = '<div class="chat-list" id="chatList"></div>';
    var list = document.getElementById('chatList');
    chatHistory.forEach(function(msg) {
      appendChatBubble(list, msg.role, msg.content);
    });
    content.scrollTop = content.scrollHeight;
  }
  inputArea.innerHTML =
    '<div class="chat-bar">' +
      '<input type="text" id="explainInput" placeholder="输入你想了解的算法或数据结构..." style="flex:1">' +
      '<button class="btn" id="explainBtn">发送</button>' +
    '</div>';
  document.getElementById('explainBtn').addEventListener('click', doExplain);
  document.getElementById('explainInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doExplain();
  });
  // 自动聚焦
  setTimeout(function() {
    var inp = document.getElementById('explainInput');
    if (inp) inp.focus();
  }, 100);
}

function appendChatBubble(container, role, html) {
  var div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  div.innerHTML = '<div class="msg-label">' + (role === 'user' ? '🧑 你' : '🤖 AI 助教') + '</div>' + html;
  container.appendChild(div);
  highlightAllCode(container);
  renderMermaidDiagrams(container);
}

async function doExplain() {
  var input = document.getElementById('explainInput');
  var topic = input.value.trim();
  if (!topic) return;
  input.value = '';

  var content = document.getElementById('content');

  // 第一次对话时替换空状态
  if (chatHistory.length === 0) {
    content.innerHTML = '<div class="chat-list" id="chatList"></div>';
  }

  var list = document.getElementById('chatList');
  if (!list) {
    content.innerHTML = '<div class="chat-list" id="chatList"></div>';
    list = document.getElementById('chatList');
  }

  // 添加用户消息
  chatHistory.push({role:'user', content:'<p>' + escapeHtml(topic) + '</p>'});
  appendChatBubble(list, 'user', '<p>' + escapeHtml(topic) + '</p>');

  // 添加 AI 占位消息
  var aiBubble = document.createElement('div');
  aiBubble.className = 'chat-msg ai';
  aiBubble.innerHTML = '<div class="msg-label">🤖 AI 助教</div><div class="card-body" id="streamContent"><span class="spinner"></span>思考中...</div>';
  list.appendChild(aiBubble);
  content.scrollTop = content.scrollHeight;

  var rawText = '';
  try {
    var r = await fetch('/api/explain/stream', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({topic})
    });
    var reader = r.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream:true});
      var lines = buffer.split('\n');
      buffer = lines.pop();
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.startsWith('data: ')) {
          var d = line.slice(6);
          if (d === '[DONE]') continue;
          try {
            var p = JSON.parse(d);
            if (p.error) {
              document.getElementById('streamContent').innerHTML = '<p style="color:var(--red)">' + escapeHtml(p.error) + '</p>';
            }
            if (p.content) {
              rawText += p.content;
              document.getElementById('streamContent').innerHTML = parseMarkdown(rawText);
              content.scrollTop = content.scrollHeight;
            }
          } catch(e) {}
        }
      }
    }
    var finalHtml = parseMarkdown(rawText);
    chatHistory.push({role:'ai', content:finalHtml});
    aiBubble.querySelector('.card-body').innerHTML = finalHtml;
    aiBubble.querySelector('.card-body').removeAttribute('id');
    highlightAllCode(aiBubble);
    renderMermaidDiagrams(aiBubble);
  } catch(e) {
    aiBubble.querySelector('.card-body').innerHTML = '<p style="color:var(--red)">请求失败: ' + escapeHtml(e.message) + '</p>';
  }
  content.scrollTop = content.scrollHeight;
}

// ── Analyze ────────────────────────────
function renderAnalyze(content, inputArea) {

    '<div class="empty-state">' +
      '<div class="icon">🔍</div>' +
      '<p>粘贴你的代码，AI 会用苏格拉底式提问引导你找到问题</p>' +
      '<p style="font-size:13px;color:var(--text-dim)">支持编译运行 + 样例对拍，先跑测试再看 AI 分析</p>' +
    '</div>';
  inputArea.innerHTML =
    '<textarea id="analyzeCode" rows="6" placeholder="在此粘贴 C++ 代码..." style="margin-bottom:8px"></textarea>' +
    '<div style="display:flex;gap:8px;margin-bottom:8px">' +
      '<div style="flex:1"><label style="font-size:12px;color:var(--text-dim)">样例输入 stdin</label><textarea id="sampleInput" rows="2" style="width:100%" placeholder="1 2&#10;3 4"></textarea></div>' +
      '<div style="flex:1"><label style="font-size:12px;color:var(--text-dim)">期望输出 stdout</label><textarea id="sampleOutput" rows="2" style="width:100%" placeholder="3&#10;7"></textarea></div>' +
    '</div>' +
    '<div style="margin-bottom:8px">' +
      '<input type="text" id="analyzeProblem" placeholder="题目描述（可选）">' +
    '</div>' +
    '<div style="display:flex;gap:12px">' +
      '<button class="btn" id="runBtn">▶ 编译运行</button>' +
      '<button class="btn secondary" id="analyzeBtn">🤖 AI 分析</button>' +
      '<button class="btn secondary" id="hintBtn">💡 更多提示</button>' +
      '<button class="btn secondary" id="recordErrBtn">📝 记录错误</button>' +
    '</div>';
  document.getElementById('runBtn').addEventListener('click', doCompileRun);
  document.getElementById('analyzeBtn').addEventListener('click', doAnalyze);
  document.getElementById('hintBtn').addEventListener('click', doHint);
  document.getElementById('recordErrBtn').addEventListener('click', recordErrorDialog);
}

async function doAnalyze() {
  const code = document.getElementById('analyzeCode').value.trim();
  const problem = document.getElementById('analyzeProblem').value.trim();
  if (!code) return;
  const content = document.getElementById('content');
  content.innerHTML = '';

  const msgDiv = document.createElement('div');
  msgDiv.className = 'card';
  msgDiv.innerHTML = '<div class="card-header"><span class="spinner"></span>正在分析代码...</div><div class="card-body" id="streamContent"></div>';
  content.appendChild(msgDiv);

  try {
    const r = await fetch('/api/analyze/stream', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code, problem})
    });
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let rawText = '';
    let firstChunk = true;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const d = line.slice(6);
          if (d === '[DONE]') {
            msgDiv.querySelector('.card-header').textContent = '🔍 代码分析结果';
            continue;
          }
          try {
            const p = JSON.parse(d);
            if (p.error) {
              document.getElementById('streamContent').innerHTML += '<p style="color:var(--red)">' + escapeHtml(p.error) + '</p>';
            }
            if (firstChunk && p.warnings && p.warnings.length > 0) {
              firstChunk = false;
              const warnDiv = document.createElement('div');
              warnDiv.className = 'card warn';
              warnDiv.innerHTML = '<div class="card-header warn">⚠️ 记忆提醒</div><div class="card-body">你之前在 [' + escapeHtml(p.category) + '] 类型题目中有 ' + p.warnings.length + ' 个重复错误模式</div>';
              content.appendChild(warnDiv);
            }
            if (p.content) {
              rawText += p.content;
              document.getElementById('streamContent').innerHTML = parseMarkdown(rawText);
              content.scrollTop = content.scrollHeight;
            }
          } catch(e) {}
        }
      }
    }
    highlightAllCode(document.getElementById('streamContent'));
    renderMermaidDiagrams(document.getElementById('streamContent'));
  } catch(e) {
    document.getElementById('streamContent').innerHTML += '<p style="color:var(--red)">' + escapeHtml(e.message) + '</p>';
  }
}

async function doCompileRun() {
  var code = document.getElementById('analyzeCode').value.trim();
  var input = document.getElementById('sampleInput').value;
  var expected = document.getElementById('sampleOutput').value;
  if (!code) return;

  var content = document.getElementById('content');
  content.innerHTML = '';

  var card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<div class="card-header"><span class="spinner"></span>编译运行中...</div><div class="card-body"></div>';
  content.appendChild(card);

  try {
    var r = await fetch('/api/compile-run', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code:code, input:input, expected:expected})
    });
    var d = await r.json();

    var html = '';
    // 编译结果
    if (d.compile_success) {
      html += '<p>✅ <b style="color:var(--green)">编译成功</b></p>';
    } else {
      html += '<p>❌ <b style="color:var(--red)">编译失败</b></p>';
      html += '<pre><code>' + escapeHtml(d.compile_errors || '') + '</code></pre>';
    }

    // 运行结果
    if (d.run_success !== undefined) {
      if (d.error) {
        html += '<p>❌ <b style="color:var(--red)">' + escapeHtml(d.error) + '</b></p>';
      } else {
        html += '<p>▶ <b>运行结果:</b> 退出码 ' + d.exit_code + '</p>';
        if (d.stderr) {
          html += '<p style="color:var(--yellow)">⚠ stderr:</p><pre><code>' + escapeHtml(d.stderr) + '</code></pre>';
        }
        html += '<p><b>程序输出:</b></p><pre><code>' + escapeHtml(d.stdout || '(无输出)') + '</code></pre>';

        if (expected) {
          if (d.match) {
            html += '<p>🎉 <b style="color:var(--green)">输出完全匹配！</b></p>';
          } else {
            html += '<p>❌ <b style="color:var(--red)">输出不匹配</b></p>';
            html += '<p><b>期望输出:</b></p><pre><code>' + escapeHtml(expected) + '</code></pre>';
            if (d.diff) {
              html += '<p><b>差异:</b></p><pre><code>' + escapeHtml(d.diff) + '</code></pre>';
            }
          }
        }
      }
    }

    card.innerHTML = '<div class="card-header">▶ 编译运行结果</div><div class="card-body">' + html + '</div>';
    highlightAllCode(card);
  } catch(e) {
    card.innerHTML = '<div class="card-header" style="color:var(--red)">请求失败</div><div class="card-body"><p>' + escapeHtml(e.message) + '</p></div>';
  }
}

async function doHint() {
  const content = document.getElementById('content');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'card';
  msgDiv.innerHTML = '<div class="card-header"><span class="spinner"></span>获取提示...</div><div class="card-body"></div>';
  content.appendChild(msgDiv);
  content.scrollTop = content.scrollHeight;
  try {
    const r = await fetch('/api/hint', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    const d = await r.json();
    msgDiv.innerHTML = '<div class="card-header">💡 更多提示</div><div class="card-body">' + parseMarkdown(d.result || d.error) + '</div>';
    highlightAllCode(msgDiv);
    renderMermaidDiagrams(msgDiv);
  } catch(e) {
    msgDiv.innerHTML = '<div class="card-body" style="color:var(--red)">' + escapeHtml(e.message) + '</div>';
  }
}

function recordErrorDialog() {
  var cat = prompt('题目类型 (dp/graph/tree/greedy/math/string/data_structure/general):', 'general');
  if (!cat) return;
  var et = prompt('错误类型 (边界条件/初始化/溢出/逻辑错误/特判遗漏):', '逻辑错误');
  if (!et) return;
  var desc = prompt('简短描述:');
  if (!desc) return;
  fetch('/api/memory/record', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({category:cat, error_type:et, description:desc})
  }).then(function() { alert('已记录'); });
}

async function doPractice() {

// ── Memory ─────────────────────────────
async function loadMemory(content, inputArea) {
  content.innerHTML = '<div class="card"><div class="card-header"><span class="spinner"></span>加载记忆库...</div></div>';
  try {
    var r = await fetch('/api/memory');
    var d = await r.json();
    var html = '';
    if (d.errors.length === 0) {
      html = '<div class="empty-state"><div class="icon">🎉</div><p>记忆库为空，继续保持！</p></div>';
    } else {
      html = '<div class="card"><div class="card-header">📋 错误记忆档案</div>';
      d.errors.forEach(function(e) {
        var cls = e.mastered ? 'green' : 'red';
        html += '<div class="error-item"><span>' + escapeHtml(e.time) + ' · [' + escapeHtml(e.category) + '] ' + escapeHtml(e.error_type) + ' · ' + escapeHtml(e.description) + '</span><span class="tag ' + cls + '">' + (e.mastered ? '已掌握' : '待解决') + '</span></div>';
      });
      html += '</div>';
      if (d.patterns.length > 0) {
        html += '<div class="card" style="margin-top:12px"><div class="card-header warn">🔁 高频重复错误</div>';
        d.patterns.forEach(function(p) {
          html += '<p style="margin:4px 0">[' + escapeHtml(p.category) + '] ' + escapeHtml(p.error_type) + ' — 已出现 <b style="color:var(--red)">' + p.cnt + '</b> 次</p>';
        });
        html += '</div>';
      }
    }
    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = '<div class="card" style="color:var(--red)">加载失败: ' + escapeHtml(e.message) + '</div>';
  }
  inputArea.innerHTML =
    '<div style="display:flex;gap:12px">' +
      '<button class="btn secondary" id="markMasteredBtn">✅ 标记某类错误已掌握</button>' +
    '</div>';
  document.getElementById('markMasteredBtn').addEventListener('click', markMastered);
}

function markMastered() {
  var t = prompt('输入要标记的错误类型:');
  if (!t) return;
  fetch('/api/memory/mark-mastered', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({error_type:t})})
    .then(function() { alert('已标记'); switchPage('memory'); });
}

async function loadStats(content, inputArea) {

      '</div>';

      '<div class="card-header">⚙️ API 配置</div>' +
      '<div class="card-body">' +
        '<div class="form-row"><label>状态</label><span style="color:' + (c.has_key ? 'var(--green)' : 'var(--red)') + '">' + (c.has_key ? '✅ 已配置' : '❌ 未配置 API Key') + '</span></div>' +
        '<div class="form-row"><label>API Key</label><input type="password" id="cfgKey" placeholder="' + escapeHtml(c.masked_key || 'sk-...') + '" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px;color:var(--text);font-size:13px"></div>' +
        '<div class="form-row"><label>API Base</label><input type="text" id="cfgBase" value="' + escapeHtml(c.api_base) + '" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px;color:var(--text);font-size:13px"></div>' +
        '<div class="form-row"><label>模型</label><input type="text" id="cfgModel" value="' + escapeHtml(c.model) + '" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px;color:var(--text);font-size:13px"></div>' +
      '</div>' +
    '</div>';
  inputArea.innerHTML =
    '<div style="display:flex;gap:12px">' +
      '<button class="btn" id="saveConfigBtn">💾 保存配置</button>' +
    '</div>';
  document.getElementById('saveConfigBtn').addEventListener('click', saveConfig);
}

async function saveConfig() {
  var api_key = document.getElementById('cfgKey').value.trim();
  var api_base = document.getElementById('cfgBase').value.trim();
  var model = document.getElementById('cfgModel').value.trim();
  var body = {api_base: api_base, model: model};
  if (api_key) body.api_key = api_key;
  var r = await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (r.ok) {
    document.getElementById('apiStatus').textContent = (api_key || document.getElementById('cfgKey').placeholder !== '****') ? '🔗 已连接' : '⚠️ 未配置 API Key';
    alert('配置已保存');
  }
}
